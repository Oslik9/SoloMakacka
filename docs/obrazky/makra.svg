<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Rozložení maker pro 2 400 kcal: bílkoviny 30 %, sacharidy 45 %, tuky 25 %</title>
  <rect width="640" height="320" rx="12" fill="#fcfcfb"/>
  <circle cx="160" cy="160" r="90" fill="none" stroke="#2a78d6" stroke-width="34" stroke-dasharray="166.65 565.49" stroke-dashoffset="0.00" transform="rotate(-90 160 160)"/>
<circle cx="160" cy="160" r="90" fill="none" stroke="#eb6834" stroke-width="34" stroke-dasharray="251.47 565.49" stroke-dashoffset="-169.65" transform="rotate(-90 160 160)"/>
<circle cx="160" cy="160" r="90" fill="none" stroke="#1baf7a" stroke-width="34" stroke-dasharray="138.37 565.49" stroke-dashoffset="-424.12" transform="rotate(-90 160 160)"/>

  <text x="160" y="158" text-anchor="middle" fill="#0b0b0b" font-size="30" font-weight="700">2 400</text>
  <text x="160" y="184" text-anchor="middle" fill="#52514e" font-size="16">kcal denně</text>
  <rect x="330" y="91" width="16" height="16" rx="4" fill="#2a78d6"/>
  <text x="356" y="105" fill="#0b0b0b" font-size="20" font-weight="600">Bílkoviny · 30 %</text>
  <text x="356" y="129" fill="#52514e" font-size="16">180 g denně = 720 kcal</text>
<rect x="330" y="153" width="16" height="16" rx="4" fill="#eb6834"/>
  <text x="356" y="167" fill="#0b0b0b" font-size="20" font-weight="600">Sacharidy · 45 %</text>
  <text x="356" y="191" fill="#52514e" font-size="16">270 g denně = 1080 kcal</text>
<rect x="330" y="215" width="16" height="16" rx="4" fill="#1baf7a"/>
  <text x="356" y="229" fill="#0b0b0b" font-size="20" font-weight="600">Tuky · 25 %</text>
  <text x="356" y="253" fill="#52514e" font-size="16">67 g denně = 603 kcal</text>

  <text x="330" y="292" fill="#8a8984" font-size="13">Příklad pro 80 kg, mírný deficit.</text>
</svg>
